name: auto-publish
# ChatGPT（下書き）× Claude（審査・推敲）で週1本の記事を作成し、検証を通れば自動公開する。
# 停止: リポジトリ変数 AUTO_PUBLISH_ENABLED を true 以外にする。
on:
  schedule:
    - cron: '17 21 * * 1'   # 毎週火曜 06:17 JST
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write
concurrency:
  group: auto-publish
  cancel-in-progress: false
jobs:
  publish:
    if: vars.AUTO_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ensure label
        run: gh label create auto-publish --color 0E8A16 --description "自動記事パイプライン" --force
      - name: Skip while an automated PR awaits review
        id: guard
        run: echo "open=$(gh pr list --label auto-publish --state open --json number --jq length)" >> "$GITHUB_OUTPUT"
      - name: Generate article (ChatGPT → Claude)
        if: steps.guard.outputs.open == '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python3 tools/auto-publish/pipeline.py --result "$RUNNER_TEMP/result.json" || true
      - name: Commit, verify, PR, auto-merge
        if: steps.guard.outputs.open == '0'
        run: bash tools/auto-publish/ship.sh "$RUNNER_TEMP/result.json"
